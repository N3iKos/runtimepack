[workspace]
members = [
    "cli",
    "core",
    "pack",
    "engines/rgss",
    "engines/rpgmaker_web",
    "engines/renpy",
    "engines/tyrano",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RuntimePack Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/anomalyco/antigravity"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
sha2 = "0.10"
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
