[package]
name = "runtimepack"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "runtimepack"
path = "src/main.rs"

[lib]
name = "runtimepack_cli"
path = "src/lib.rs"

[[test]]
name = "integration_detection"
path = "../tests/integration/detection_test.rs"

[[test]]
name = "build_test"
path = "../tests/integration/build_test.rs"

[[test]]
name = "integration_compatibility"
path = "../tests/integration/compatibility_test.rs"

[[test]]
name = "asset_audit_cli_test"
path = "../tests/integration/asset_audit_cli_test.rs"

[[test]]
name = "asset_audit_contract_test"
path = "../tests/integration/asset_audit_contract_test.rs"

[[test]]
name = "asset_audit_report_test"
path = "../tests/integration/asset_audit_report_test.rs"

[[test]]
name = "probe_scenario_test"
path = "tests/probe_scenario_test.rs"

[[test]]
name = "vnmaker_detection_test"
path = "../tests/integration/vnmaker_detection_test.rs"

[[test]]
name = "vnmaker_asset_audit_test"
path = "../tests/integration/vnmaker_asset_audit_test.rs"

[[test]]
name = "cli_root_discovery_test"
path = "../tests/integration/cli_root_discovery_test.rs"

[[test]]
name = "gradle_invocation_test"
path = "../tests/integration/gradle_invocation_test.rs"

[[test]]
name = "portable_resource_test"
path = "../tests/integration/portable_resource_test.rs"

[[test]]
name = "workspace_cleanup_test"
path = "../tests/integration/workspace_cleanup_test.rs"

[[test]]
name = "detector_parity_test"
path = "../tests/integration/detector_parity_test.rs"

[dependencies]
runtimepack-core = { path = "../core" }
runtimepack-pack = { path = "../pack" }
runtimepack-engine-rgss = { path = "../engines/rgss" }
runtimepack-engine-rpgmaker-web = { path = "../engines/rpgmaker_web" }
runtimepack-engine-renpy = { path = "../engines/renpy" }
runtimepack-engine-tyrano = { path = "../engines/tyrano" }
runtimepack-engine-vnmaker = { path = "../engines/vnmaker" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
