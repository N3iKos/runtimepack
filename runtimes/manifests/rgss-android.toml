manifest_version = 1
id = "rgss-android"
name = "RuntimePack RGSS Backend (XP/VX/VX Ace)"
version = "0.1.0"
runtime_api = 1
family = "rgss"
engines = ["rpgmaker-xp", "rpgmaker-vx", "rpgmaker-vxace"]
abis = ["arm64-v8a", "x86_64"]

[android]
min_sdk = 26
target_sdk = 34

[artifacts]
android_module = "runtime-rgss"

capabilities = [
  "fs.vfs.read",
  "fs.vfs.seek",
  "fs.save.write",
  "input.keyboard",
  "input.gamepad",
  "input.virtual_gamepad",
  "graphics.surface",
  "audio.standard",
  "rgss.win32.user32.keyboard",
  "rgss.win32.kernel32.temp",
]

[licenses]
license_id = "GPL-2.0-or-later"
notice_bundle = "licenses/rgss"
