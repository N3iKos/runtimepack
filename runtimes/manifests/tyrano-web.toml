manifest_version = 1
id = "tyrano-web"
name = "RuntimePack Tyrano Web Adapter"
version = "0.1.0"
runtime_api = 1
family = "tyrano"
engines = ["tyrano"]
abis = ["arm64-v8a", "x86_64"]

[android]
min_sdk = 26
target_sdk = 34

[artifacts]
android_module = "adapter-tyrano"

capabilities = [
  "fs.vfs.read",
  "fs.save.write",
  "input.keyboard",
  "input.pointer",
  "web.local_origin",
  "web.javascript",
]

[licenses]
license_id = "MIT"
notice_bundle = "licenses/tyrano"
