manifest_version = 1
id = "vnmaker-web"
name = "RuntimePack Visual Novel Maker Web Adapter"
version = "0.1.0"
runtime_api = 1
family = "vnmaker-web"
engines = ["visual-novel-maker"]
abis = ["arm64-v8a"]
capabilities = [
  "fs.vfs.read",
  "fs.save.write",
  "input.keyboard",
  "input.pointer",
  "web.local_origin",
  "web.javascript",
  "web.webgl",
  "web.webaudio",
]

[android]
min_sdk = 26
target_sdk = 34

[artifacts]
android_module = "adapter-vnmaker"

[licenses]
license_id = "MIT OR Apache-2.0"
notice_bundle = "licenses/vnmaker"
