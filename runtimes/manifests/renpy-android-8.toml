manifest_version = 1
id = "renpy-android-8"
name = "RuntimePack Ren'Py 8 Runtime"
version = "8.4.1"
runtime_api = 1
family = "renpy"
engines = ["renpy"]
abis = ["arm64-v8a", "x86_64"]

[android]
min_sdk = 26
target_sdk = 34

[artifacts]
android_module = "runtime-renpy-8"

capabilities = [
  "fs.vfs.read",
  "fs.save.write",
  "input.keyboard",
  "input.pointer",
  "renpy.runtime.versioned",
  "renpy.python.pure",
]

[licenses]
license_id = "MIT"
notice_bundle = "licenses/renpy"
