manifest_version = 1
id = "renpy-android-8"
name = "RuntimePack Ren'Py 8 Runtime"
version = "8.3.7"
runtime_api = 1
family = "renpy"
engines = ["renpy"]
abis = ["arm64-v8a"]
capabilities = [
  "fs.vfs.read",
  "fs.save.write",
  "input.keyboard",
  "input.pointer",
  "renpy.runtime.versioned",
  "renpy.python.pure",
]

[android]
min_sdk = 26
target_sdk = 34

[artifacts]
android_module = "runtimes/renpy"
native_libs_dir = "runtimes/renpy/jni"

[licenses]
license_id = "MIT"
notice_bundle = "licenses/renpy"
required_notice_files = [
  "licenses/LICENSE.txt",
  "licenses/NOTICE.txt",
  "licenses/components.json",
]
